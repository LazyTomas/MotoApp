<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>יומן רכב</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="יומן רכב">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#F2F2F7; --cell:#FFFFFF; --ink:#000000; --muted:#8A8A8E; --sep:rgba(60,60,67,.2);
  --fill:rgba(118,118,128,.12); --seg-on:#FFFFFF; --tint:#007AFF;
  --red:#E0352B; --orange:#E07A00; --green:#248A3D; --track:#E3E3E8;
  --sheet:#F2F2F7; --sheetcell:#FFFFFF; --bar:rgba(249,249,251,.86); --scrim:rgba(0,0,0,.32);
  --plate:#F7CB15; --plateink:#111;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew","Segoe UI",Arial,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --cell:#1C1C1E; --ink:#FFFFFF; --muted:#8E8E93; --sep:rgba(84,84,88,.55);
    --fill:rgba(118,118,128,.24); --seg-on:#636366; --tint:#0A84FF;
    --red:#FF453A; --orange:#FF9F0A; --green:#30D158; --track:#2C2C2E;
    --sheet:#1C1C1E; --sheetcell:#2C2C2E; --bar:rgba(22,22,24,.86); --scrim:rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1C1C1E; --ink:#FFFFFF; --muted:#8E8E93; --sep:rgba(84,84,88,.55);
  --fill:rgba(118,118,128,.24); --seg-on:#636366; --tint:#0A84FF;
  --red:#FF453A; --orange:#FF9F0A; --green:#30D158; --track:#2C2C2E;
  --sheet:#1C1C1E; --sheetcell:#2C2C2E; --bar:rgba(22,22,24,.86); --scrim:rgba(0,0,0,.5); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.3;letter-spacing:-.2px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;unicode-bidi:isolate;direction:ltr;display:inline-block}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}

main{max-width:560px;margin:0 auto;padding:0 16px calc(100px + env(safe-area-inset-bottom,0px))}
.navrow{display:flex;align-items:center;height:44px;margin:0 -8px}
.navbtn{height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;gap:2px;color:var(--tint);font-size:17px;padding:0 8px}
.navbtn svg.i{font-size:24px}
.navbtn.back svg.i{font-size:22px;stroke-width:2.3}
.navrow .sp{flex:1}
h1{margin:0 0 14px;font-size:32px;font-weight:700;letter-spacing:.2px;line-height:1.15}
.sub-h{color:var(--muted);font-size:15px;margin:-10px 0 16px}

.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px}
.seg button{flex:1;height:30px;border-radius:7px;font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--seg-on);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}

.group{background:var(--cell);border-radius:10px;overflow:hidden}
.sheet .group{background:var(--sheetcell)}
.gap{height:22px}
.ghdr{font-size:13px;color:var(--muted);padding:0 16px 7px;margin-top:24px}
.ghdr:first-child{margin-top:4px}
.foot{font-size:13px;color:var(--muted);padding:7px 16px 0;line-height:1.35}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 16px;text-align:start;position:relative}
.row + .row::before{content:"";position:absolute;top:0;left:0;right:var(--inset,16px);border-top:.5px solid var(--sep)}
.row .lbl{flex:1}
.row .val{color:var(--muted);text-align:end}
.row.tall{padding-top:10px;padding-bottom:10px}
.chev{color:var(--muted);opacity:.6;font-size:13px;display:flex}
.chev svg.i{transform:scaleX(-1)}
.mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mid .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.ic svg.i{width:17px;height:17px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.st-over{--c:var(--red)} .st-soon{--c:var(--orange)} .st-ok{--c:var(--green)} .st-none{--c:var(--track)}
.stxt.st-over{color:var(--red)} .stxt.st-soon{color:var(--orange)}
.empty{padding:32px 20px;text-align:center;color:var(--muted);font-size:15px;line-height:1.4}
.empty b{display:block;color:var(--ink);font-size:17px;font-weight:600;margin-bottom:4px}
.empty .cta{margin-top:16px}

/* Israeli licence plate */
.plate{display:inline-flex;align-items:stretch;direction:ltr;background:var(--plate);color:var(--plateink);border:1.5px solid #1a1a1a;border-radius:5px;overflow:hidden;font-weight:700;line-height:1;flex:none}
.plate .il{background:#1D4FA3;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 3px;gap:1px}
.plate .il b{font-size:.42em;letter-spacing:.5px}
.plate .il i{width:.62em;height:.42em;background:#fff;display:block;position:relative;border-radius:1px}
.plate .il i::before{content:"";position:absolute;left:0;right:0;top:12%;height:12%;background:#1D4FA3;box-shadow:0 .3em 0 #1D4FA3}
.plate .pn{padding:.18em .38em .14em;font-size:1em;letter-spacing:.04em;font-variant-numeric:tabular-nums;display:flex;align-items:center}
.plate.sm{font-size:15px} .plate.md{font-size:20px} .plate.lg{font-size:30px}
.plate.empty-p .pn{color:rgba(0,0,0,.45);font-weight:600}

/* vehicle cards */
.vcard{display:block;width:100%;text-align:start;background:var(--cell);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.vcard:active{opacity:.7}
.vcard .top{display:flex;align-items:center;gap:12px}
.vcard .nm{font-weight:600;font-size:19px}
.vcard .meta{color:var(--muted);font-size:14px;margin-top:2px}
.vcard .kind{width:38px;height:38px;border-radius:10px;background:var(--fill);display:grid;place-items:center;color:var(--ink);flex:none}
.vcard .kind svg.i{width:22px;height:22px}
.vcard .pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:14px;background:var(--fill);font-size:13px}
.pill .dot{width:8px;height:8px}
.vhead{display:flex;flex-direction:column;align-items:flex-start;gap:12px;margin:4px 0 6px}
.vhead h1{margin:0}

/* toolbar */
.toolbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.toolbar .in{max-width:528px;margin:0 auto;display:flex}
.cta{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:50px;border-radius:12px;font-size:17px;font-weight:600;color:#fff;background:var(--tint)}
.cta:active{opacity:.75}
.cta svg.i{width:20px;height:20px;stroke-width:2.4}
.cta.ghost{background:var(--fill);color:var(--tint)}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s}
.sheet{position:relative;width:100%;max-width:560px;max-height:calc(100% - 12px - env(safe-area-inset-top,0px));overflow:auto;background:var(--sheet);
  border-radius:12px 12px 0 0;padding:6px 16px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.sheet::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--fill);margin:0 auto 4px}
.sheet-wrap.on .scrim{opacity:1} .sheet-wrap.on .sheet{transform:none}
.sheet.alert{background:transparent;padding:0 8px calc(8px + env(safe-area-inset-bottom,0px))}
.sheet.alert::before{display:none}
.alert .group{background:var(--cell);margin-bottom:8px;border-radius:13px}
.alert .head{padding:14px 16px;text-align:center;font-size:13px;color:var(--muted)}
.alert .head b{display:block;font-size:13px;font-weight:600;margin-bottom:2px}
.alert .head:empty{display:none}
.alert .act{display:block;width:100%;height:56px;font-size:20px;color:var(--tint);border-top:.5px solid var(--sep)}
.alert .head:empty + .act{border-top:0}
.alert .act.danger{color:var(--red)} .alert .act.cancel{font-weight:600;border:0}
.snav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px;margin-bottom:8px}
.snav .l{justify-self:start;color:var(--tint)} .snav .r{justify-self:end;color:var(--tint);font-weight:600}
.snav .ttl{font-weight:600}
.snav .seg{width:250px}

/* form rows */
.inp{flex:1;min-width:0;border:0;background:transparent;font-size:17px;height:44px;padding:0;outline:none;text-align:end;color:var(--muted)}
.inp:focus{color:var(--ink)}
.inp::placeholder{color:var(--muted);opacity:.6}
.inp.full{text-align:start;color:var(--ink)}
.unit{color:var(--muted);font-size:15px}
.dateval{position:relative;color:var(--muted);display:inline-flex;align-items:center;min-height:44px}
.dateval input{position:absolute;inset:0;opacity:0;width:100%;-webkit-appearance:none}
.clr{color:var(--tint);font-size:15px}
textarea.inp{height:auto;min-height:72px;padding:11px 0;resize:none;text-align:start;color:var(--ink);line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
.chips button{padding:7px 12px;border-radius:16px;background:var(--fill);font-size:15px}
.chips button[aria-pressed="true"]{background:var(--tint);color:#fff}
.lookup{color:var(--tint);font-size:15px;white-space:nowrap}
.lookup[disabled]{opacity:.5}

/* documents */
.docs{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
.doc{width:72px;height:72px;border-radius:10px;background:var(--fill) center/cover no-repeat;display:grid;place-items:center;color:var(--muted);font-size:13px;font-weight:600;position:relative}
.doc.add{color:var(--tint)}
.doc.add svg.i{width:26px;height:26px}
.viewer{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column}
.viewer .vbar{display:flex;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;color:#fff}
.viewer .vbar button{color:#fff;font-size:17px;padding:6px}
.viewer .vbar .danger{color:#FF453A}
.viewer .vimg{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:rgba(30,30,32,.92);color:#fff;
  padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;transition:.2s;z-index:70;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.act{pointer-events:auto;display:flex;align-items:center;gap:16px;padding:8px 8px 8px 16px}
.toast.act button{color:#64D2FF;font-weight:600;padding:4px 8px;font-size:15px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="view"></main>
<div class="toolbar"><div class="in"><button class="cta" id="addRec"><svg class="i" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg>רישום חדש</button></div></div>
<input type="file" id="fileJson" accept=".json,application/json" class="hidden">
<input type="file" id="fileDoc" accept="image/*,application/pdf" multiple class="hidden">
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ---------- icons ---------- */
const ICONS={
 car:'<path d="M4 16.5v-4l2-5.2A1.8 1.8 0 0 1 7.7 6h8.6a1.8 1.8 0 0 1 1.7 1.3l2 5.2v4z"/><path d="M4 12.5h16M6.5 16.5v2M17.5 16.5v2"/><circle cx="7.5" cy="14.5" r=".9"/><circle cx="16.5" cy="14.5" r=".9"/>',
 moto:'<circle cx="5.5" cy="16.5" r="3"/><circle cx="18.5" cy="16.5" r="3"/><path d="M8.5 16.5h4l3-6h-4.5M15.5 10.5l3 6M13 6h2.5l1.5 4.5M6 10.5h4l2.5 3"/>',
 wrench:'<path d="M15 4.5a4 4 0 0 0-4.7 5.2L4 16a2.1 2.1 0 0 0 3 3l6.3-6.3A4 4 0 0 0 18.5 8l-2.6 2.6-2.5-.5-.5-2.5z"/>',
 shield:'<path d="M12 3.5l7 2.5v5.5c0 4.3-3 7.7-7 9-4-1.3-7-4.7-7-9V6z"/><path d="M9 12l2 2 4-4"/>',
 check:'<rect x="4.5" y="3.5" width="15" height="17" rx="2"/><path d="M8.5 9l2 2 4-4M8.5 15h7"/>',
 note:'<path d="M5 4.5h10l4 4v11H5z"/><path d="M15 4.5v4h4M8.5 13h7M8.5 16.5h5"/>',
 more:'<circle cx="12" cy="12" r="9"/><path d="M8 12h.01M12 12h.01M16 12h.01" stroke-width="2.6"/>',
 plus:'<path d="M12 6v12M6 12h12"/>',
 back:'<path d="M9 5l7 7-7 7"/>',
 chev:'<path d="M9 5l7 7-7 7"/>',
 cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/>',
 clip:'<path d="M20 11.5l-8.3 8.3a5 5 0 0 1-7-7L13 4.5a3.3 3.3 0 0 1 4.7 4.7l-8.3 8.3a1.7 1.7 0 0 1-2.4-2.4L14.5 7.6"/>',
 truck:'<path d="M3 6.5h11v10H3zM14 9.5h4l3 3.5v3.5h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',
 id:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M5.5 16c.6-1.6 1.7-2.5 3-2.5s2.4.9 3 2.5M14 10h4M14 13.5h3"/>',
 globe:'<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.3 2.4 3.5 5.2 3.5 8.5s-1.2 6.1-3.5 8.5c-2.3-2.4-3.5-5.2-3.5-8.5s1.2-6.1 3.5-8.5z"/>',
 gauge:'<path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l3.5-5"/>'
};
const svg=(n,x='')=>`<svg class="i" viewBox="0 0 24 24" aria-hidden="true" ${x}>${ICONS[n]}</svg>`;
const CHEV=`<span class="chev">${svg('chev')}</span>`;

/* ---------- constants ---------- */
const TYPES={svc:{lbl:'טיפול',icon:'wrench',color:'#2F6FDB'},ins:{lbl:'ביטוח',icon:'shield',color:'#8E5BD9'},test:{lbl:'טסט ורישיון',icon:'check',color:'#2E9E5B'},other:{lbl:'אחר',icon:'note',color:'#6E7781'}};
const INS={mand:'ביטוח חובה',comp:'ביטוח מקיף',third:'ביטוח צד ג׳'};
const SVC_ITEMS={car:['טיפול תקופתי','שמן ומסנן','צמיגים','בלמים','מצבר','מיזוג','מגבים','פנסים','תיקון'],moto:['טיפול תקופתי','שמן ומסנן','צמיגים','בלמים','מצבר','שרשרת וגלגלי שיניים','מצתים','תיקון']};
const SVC_KM={car:15000,moto:6000,other:15000};
SVC_ITEMS.other=SVC_ITEMS.car;
const KIND_ICON={car:'car',moto:'moto',other:'truck'};
const PERS={dl:{title:'רישיון נהיגה',icon:'id',color:'#2F6FDB'},idp:{title:'רישיון נהיגה בינלאומי',icon:'globe',color:'#12907F'}};
const GOV_URL='https://data.gov.il/api/3/action/datastore_search?resource_id=053cea08-09bc-40ec-8f7a-156f0677aff3';

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ds(new Date());
const addM=(s,m)=>{const d=pd(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+m);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return ds(d)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const diffD=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const nf=new Intl.NumberFormat('he-IL',{maximumFractionDigits:2});
const money=n=>'₪'+nf.format(Math.round(n));
const km=n=>`${nf.format(Math.round(n))} ק״מ`;
const fmtD=(s,o={day:'numeric',month:'short',year:'numeric'})=>pd(s).toLocaleDateString('he-IL',o);
const num=v=>{const x=parseFloat(String(v??'').replace(/[^\d.]/g,''));return isFinite(x)?x:null};
function fmtPlate(p){const d=String(p||'').replace(/\D/g,'');if(d.length===8)return`${d.slice(0,3)}-${d.slice(3,5)}-${d.slice(5)}`;if(d.length===7)return`${d.slice(0,2)}-${d.slice(2,5)}-${d.slice(5)}`;if(d.length===6)return`${d.slice(0,2)}-${d.slice(2,4)}-${d.slice(4)}`;return d}
const plate=(p,size='md')=>`<span class="plate ${size}${p?'':' empty-p'}"><span class="il"><i></i><b>IL</b></span><span class="pn">${esc(p?fmtPlate(p):'ללא מספר')}</span></span>`;

/* ---------- storage ---------- */
let S=null;
const idb={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('yoman-rechev',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('docs')};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  req(store,mode,fn){return new Promise((res,rej)=>{const tx=this.db.transaction(store,mode),q=fn(tx.objectStore(store));tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error)})},
  get(s,k){return this.req(s,'readonly',o=>o.get(k))},
  set(s,k,v){return this.req(s,'readwrite',o=>o.put(v,k))},
  del(s,k){return this.req(s,'readwrite',o=>o.delete(k))},
  keys(s){return this.req(s,'readonly',o=>o.getAllKeys())},
  clear(s){return this.req(s,'readwrite',o=>o.clear())}
};
const fresh=()=>({v:1,vehicles:[],recs:[],personal:{},meta:{}});
async function load(){
  try{await idb.open();S=await idb.get('kv','state')}catch(e){idb.db=null}
  if(!S||!Array.isArray(S.vehicles))S=fresh();
  S.personal=S.personal||{};
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
  gcDocs();
}
let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(persist,120)}
async function persist(){clearTimeout(saveT);try{if(idb.db)await idb.set('kv','state',S)}catch(e){toast('השמירה נכשלה: '+e.message)}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')persist()});

/* ---------- due dates ---------- */
function tracks(v){
  const recs=S.recs.filter(r=>r.vid===v.id),out=[];
  const latest=(l,key)=>l.reduce((a,r)=>!a||(r[key]||'')>(a[key]||'')?r:a,null);
  for(const sub of['mand','comp','third']){
    const r=latest(recs.filter(r=>r.type==='ins'&&r.sub===sub),'end');
    if(r)out.push({k:'ins-'+sub,type:'ins',sub,title:INS[sub],due:r.end,rec:r});
  }
  if(!out.some(t=>t.sub==='mand'))out.unshift({k:'ins-mand',type:'ins',sub:'mand',title:INS.mand,missing:true});
  if(!out.some(t=>t.sub==='comp'||t.sub==='third'))out.push({k:'ins-comp',type:'ins',sub:'comp',title:'ביטוח מקיף או צד ג׳',missing:true});
  const t=latest(recs.filter(r=>r.type==='test'),'date');
  out.push(t?{k:'test',type:'test',title:'טסט ורישיון',due:t.next,rec:t}:{k:'test',type:'test',title:'טסט ורישיון',missing:true});
  const sv=latest(recs.filter(r=>r.type==='svc'),'date');
  out.push(sv?{k:'svc',type:'svc',title:'טיפול הבא',due:sv.nextDate,dueKm:sv.nextKm,rec:sv}:{k:'svc',type:'svc',title:'טיפול הבא',missing:true});
  const others=new Map();
  for(const r of recs)if(r.type==='other'&&r.next){const key=(r.title||'').trim();const o=others.get(key);if(!o||r.date>o.date)others.set(key,r)}
  for(const[key,r]of others)out.push({k:'other-'+key,type:'other',title:key||'תזכורת',due:r.next,rec:r});
  for(const x of out)Object.assign(x,status(x,v));
  return out;
}
function status(t,v){
  if(t.missing)return{st:'none',text:'לא הוזן'};
  const days=t.due?diffD(today(),t.due):null,kl=t.dueKm&&v&&v.km?t.dueKm-v.km:null;
  if(days===null&&kl===null)return{st:'none',text:'ללא מועד'};
  const over=(days!==null&&days<0)||(kl!==null&&kl<=0),soon=(days!==null&&days<=30)||(kl!==null&&kl<=1000);
  const isExp=t.type==='ins'||t.type==='test'||t.type==='pers';
  let text;
  if(over){text=days!==null&&days<0?(isExp?`פג לפני ${-days===1?'יום':-days+' ימים'}`:`באיחור של ${-days===1?'יום':-days+' ימים'}`):`עברת את המועד ב-${km(-kl)}`}
  else{const p=[];
    if(days!==null)p.push(days===0?'היום':days===1?'מחר':days<=45?`בעוד ${days} ימים`:(isExp?`בתוקף עד ${fmtD(t.due)}`:fmtD(t.due)));
    if(kl!==null)p.push(`בעוד ${km(kl)}`);
    text=p.join(' או ')}
  return{st:over?'over':soon?'soon':'ok',text,days,kl};
}
function persTracks(){
  return Object.entries(PERS).map(([k,P])=>{const p=S.personal[k]||{};
    const t={k:'p-'+k,type:'pers',pk:k,title:P.title,due:p.expiry||null,missing:!p.expiry&&!p.num&&!(p.docs||[]).length};
    Object.assign(t,status(t,null));if(!t.missing&&!t.due){t.st='none';t.text='לא הוזן תאריך תוקף'}return t});
}
function allDue(){
  const out=[];for(const v of S.vehicles)for(const t of tracks(v))if(!t.missing&&t.st!=='none')out.push({...t,v});
  for(const t of persTracks())if(!t.missing&&t.st!=='none')out.push({...t,v:null});
  const rank={over:0,soon:1,ok:2};
  return out.sort((a,b)=>rank[a.st]-rank[b.st]||(a.days??9e9)-(b.days??9e9));
}

async function trackAction(v,t){
  if(t.missing){editRecord({vid:v.id,type:t.type,sub:t.sub});return}
  const acts=[{label:t.type==='ins'?'חידוש הביטוח':t.type==='test'?'רישום טסט חדש':t.type==='svc'?'רישום טיפול':'רישום חדש',val:'new'}];
  if(t.due)acts.push({label:'הוספת תזכורת ליומן',val:'cal'});
  acts.push({label:'צפייה ברישום האחרון',val:'view'},{label:'ביטול',val:null});
  const a=await ask(`${t.title}: ${v.name||''}`,t.text,acts);
  if(a==='new')editRecord({vid:v.id,type:t.type,sub:t.sub,from:t.rec});
  else if(a==='view')editRecord({rec:t.rec});
  else if(a==='cal')addToCalendar(v,t);
}

/* ---------- sheets / alerts / toast ---------- */
function sheet(html,cls=''){
  const w=document.createElement('div');w.className='sheet-wrap';
  w.innerHTML=`<div class="scrim"></div><div class="sheet ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(w);
  requestAnimationFrame(()=>requestAnimationFrame(()=>w.classList.add('on')));
  let closed=false;
  const api={el:w.querySelector('.sheet'),onclose:null,close(){if(closed)return;closed=true;w.classList.remove('on');setTimeout(()=>w.remove(),300);api.onclose&&api.onclose()}};
  w.querySelector('.scrim').onclick=api.close;
  return api;
}
function ask(title,msg,buttons){
  return new Promise(res=>{
    const acts=buttons.filter(b=>b.val!==false&&b.val!==null),cancel=buttons.find(b=>b.val===false||b.val===null);
    const s=sheet(`<div class="group"><div class="head">${title||msg?`<b>${esc(title)}</b>${esc(msg||'')}`:''}</div>${acts.map((b,i)=>`<button class="act ${b.cls||''}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div>
      <div class="group"><button class="act cancel" data-c>${esc(cancel?cancel.label:'ביטול')}</button></div>`,'alert');
    let val=cancel?cancel.val:null;s.onclose=()=>res(val);
    s.el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{val=acts[+b.dataset.i].val;s.close()});
    s.el.querySelector('[data-c]').onclick=s.close;
  });
}
let toastT;
function toast(msg,action){
  const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${action?`<button>${esc(action.label)}</button>`:''}`;
  t.classList.toggle('act',!!action);t.classList.add('on');
  if(action)t.querySelector('button').onclick=()=>{t.classList.remove('on','act');clearTimeout(toastT);action.fn()};
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on','act'),action?5000:2400);
}
const undo=fn=>({label:'ביטול',fn});

/* ---------- documents ---------- */
let docCb=null;
function pickDocs(cb){docCb=cb;$('#fileDoc').click()}
async function compress(file){
  if(!file.type.startsWith('image/'))return file;
  try{
    const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
    const k=Math.min(1,1800/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
    c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',.82));
  }catch(_){return file}
}
async function onDocFiles(files){
  const ids=[];
  for(const f of files){
    if(f.size>25e6){toast('הקובץ גדול מדי');continue}
    const b=await compress(f),id=uid();
    try{await idb.set('docs',id,b);ids.push(id)}catch(e){toast('לא הצלחתי לשמור את הקובץ')}
  }
  if(ids.length&&docCb)docCb(ids);
}
function viewDoc(id,blob,onRemove){
  const url=URL.createObjectURL(blob);
  if(!blob.type.startsWith('image/')){
    ask('מסמך PDF','',[{label:'פתיחה',val:'open'},{label:'שיתוף או שמירה',val:'share'},{label:'הסרה מהרישום',val:'del',cls:'danger'},{label:'ביטול',val:null}]).then(a=>{
      if(a==='open')window.open(url,'_blank');
      else if(a==='share')shareBlob(blob,'מסמך.pdf');
      else if(a==='del')onRemove();
    });return;
  }
  const w=document.createElement('div');w.className='viewer';
  w.innerHTML=`<div class="vbar"><button data-x>סגירה</button><span><button data-sh>שיתוף</button> <button class="danger" data-rm>הסרה</button></span></div><div class="vimg"><img alt="" src="${url}"></div>`;
  document.body.appendChild(w);
  w.querySelector('[data-x]').onclick=()=>w.remove();
  w.querySelector('[data-sh]').onclick=()=>shareBlob(blob,'תמונה.jpg');
  w.querySelector('[data-rm]').onclick=async()=>{const ok=await ask('להסיר את התמונה מהרישום?','',[{label:'הסרה',val:true,cls:'danger'},{label:'ביטול',val:false}]);if(ok){w.remove();onRemove()}};
}
async function shareBlob(blob,name){
  const f=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(_){}}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}
}

/* ---------- calendar reminder (.ics) ---------- */
const icsTxt=x=>String(x||'').replace(/[,;\\]/g,' ').replace(/\n/g,' ');
function icsEvent(title,date,desc){
  const d=date.replace(/-/g,''),e=addD(date,1).replace(/-/g,''),now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
  return['BEGIN:VEVENT',`UID:${uid()}@yoman-rechev`,`DTSTAMP:${now}`,`DTSTART;VALUE=DATE:${d}`,`DTEND;VALUE=DATE:${e}`,`SUMMARY:${icsTxt(title)}`,`DESCRIPTION:${icsTxt(desc)}`,
    'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsTxt(title)}`,'TRIGGER:-P13DT15H','END:VALARM',
    'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsTxt(title)}`,'TRIGGER:-PT15H','END:VALARM','END:VEVENT'].join('\r\n');
}
function openICS(events){
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//yoman-rechev//HE','CALSCALE:GREGORIAN',...events,'END:VCALENDAR'].join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'}),url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
const calTitle=(v,t)=>`${t.title}${v?': '+v.name:''}`;
const calDesc=v=>v&&v.plate?'מספר רישוי '+fmtPlate(v.plate):'';
function addToCalendar(v,t){if(t.due)openICS([icsEvent(calTitle(v,t),t.due,calDesc(v))])}
function addAllToCalendar(){
  const l=allDue().filter(d=>d.due&&d.due>=today());
  if(!l.length){toast('אין מועדים עתידיים');return}
  openICS(l.map(d=>icsEvent(calTitle(d.v,d),d.due,calDesc(d.v))));
}

    const t={type:'pers',due:p.expiry||null};Object.assign(t,status(t,null));
    el.querySelector('#pForm').innerHTML=`
      <div class="preview" style="display:flex;justify-content:center;padding:4px 0 14px"><span class="ic" style="--c:${P.color};width:56px;height:56px"><svg class="i" viewBox="0 0 24 24" style="width:28px;height:28px">${ICONS[P.icon]}</svg></span></div>
      <div class="group">
        <div class="row"><span class="lbl">מספר רישיון</span><input class="inp" data-s="num" inputmode="numeric" value="${esc(p.num||'')}" maxlength="20"></div>
        ${k==='dl'?`<div class="row"><span class="lbl">דרגות</span><input class="inp" data-s="grades" placeholder="למשל: B, A2" value="${esc(p.grades||'')}" maxlength="30"></div>`:''}
        ${dateRow('issue','תאריך הנפקה')}
        ${dateRow('expiry','בתוקף עד')}
      </div>
      ${p.expiry?`<div class="foot stxt st-${t.st}">${esc(t.text)}</div>`:''}
      <div class="gap" style="height:14px"></div><div class="group"><div class="row"><textarea class="inp" data-s="note" placeholder="הערות" maxlength="500">${esc(p.note||'')}</textarea></div></div>
      <div class="ghdr">צילומים</div><div class="group"><div class="docs" id="pDocs"></div></div>
      <div class="foot">${k==='dl'?'צלם את הרישיון משני הצדדים.':'צלם את העמודים עם הפרטים והתוקף.'}</div>
      ${p.expiry&&p.expiry>=today()?`<div class="gap"></div><div class="group"><button class="row" id="pCal"><span style="color:var(--tint);display:flex;align-items:center;gap:8px">${svg('cal')} תזכורת ביומן לחידוש</span></button></div>`:''}`;
    el.querySelectorAll('[data-d]').forEach(i=>i.onchange=()=>{collect();p[i.dataset.d]=i.value||null;form()});
    el.querySelectorAll('[data-clr]').forEach(b=>b.onclick=e=>{e.preventDefault();collect();p[b.dataset.clr]=null;form()});
    docsGrid(el.querySelector('#pDocs'),()=>p.docs,ids=>{p.docs=ids});
    const c=el.querySelector('#pCal');if(c)c.onclick=()=>openICS([icsEvent(`חידוש ${P.title}`,p.expiry,p.num?'מספר '+p.num:'')]);
  }
  form();
  el.querySelector('[data-close]').onclick=s.close;
  el.querySelector('#pSave').onclick=()=>{collect();S.personal[k]=p;save();s.close();render();toast('נשמר')};
}

/* ---------- docs grid & sheet ---------- */
function docsGrid(box,getIds,setIds){
  const paint=async()=>{
    const ids=getIds()||[];
    box.innerHTML=ids.map(id=>`<button class="doc" data-doc="${id}"></button>`).join('')+`<button class="doc add" aria-label="הוספת תמונה או מסמך">${svg('plus')}</button>`;
    box.querySelector('.add').onclick=()=>pickDocs(n=>{setIds([...(getIds()||[]),...n]);paint()});
    for(const b of box.querySelectorAll('[data-doc]')){
      const id=b.dataset.doc,blob=await idb.get('docs',id).catch(()=>null);
      if(!blob){b.textContent='?';continue}
      if(blob.type.startsWith('image/'))b.style.backgroundImage=`url(${URL.createObjectURL(blob)})`;else b.textContent='PDF';
      b.onclick=()=>viewDoc(id,blob,()=>{setIds((getIds()||[]).filter(x=>x!==id));paint()});
    }
  };
  paint();
}
function docsSheet(title,foot,getIds,setIds){
  const s=sheet(`<div class="snav"><span></span><span class="ttl">${esc(title)}</span><button class="r" data-close>סיום</button></div><div class="group"><div class="docs" id="dsBox"></div></div>${foot?`<div class="foot">${esc(foot)}</div>`:''}`);
  s.el.querySelector('[data-close]').onclick=s.close;
  docsGrid(s.el.querySelector('#dsBox'),getIds,ids=>{setIds(ids);save()});
  s.onclose=()=>render();
}

/* ---------- backup ---------- */
const stamp=()=>{const d=new Date();return`${ds(d)}_${pad(d.getHours())}-${pad(d.getMinutes())}`};
const b2u=b=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(b)});
async function backupJSON(){
  toast('מכין גיבוי…');
  const docs={};
  for(const id of new Set(allDocIds())){const b=await idb.get('docs',id).catch(()=>null);if(b)docs[id]=await b2u(b)}
  const text=JSON.stringify({app:'yoman-rechev',v:1,exported:new Date().toISOString(),vehicles:S.vehicles,recs:S.recs,personal:S.personal||{},docs});
  const f=new File([text],`yoman-rechev-${stamp()}.json`,{type:'application/json'});
  let ok=true;
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){ok=e.name!=='AbortError'}}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}
  if(ok){S.meta.lastBackup=Date.now();save();toast('הגיבוי נשמר')}
}
async function restoreJSON(file){
  let d;try{d=JSON.parse(await file.text())}catch(e){toast('הקובץ אינו גיבוי תקין');return}
  if(!d||d.app!=='yoman-rechev'||!Array.isArray(d.vehicles)){toast('הקובץ אינו גיבוי של יומן רכב');return}
  const ok=await ask('לשחזר מהגיבוי?',`${d.vehicles.length} כלי רכב ו-${d.recs.length} רישומים. הנתונים הנוכחיים יוחלפו.`,[{label:'שחזור',val:true,cls:'danger'},{label:'ביטול',val:false}]);
  if(!ok)return;
  await idb.clear('docs');
  for(const[id,u]of Object.entries(d.docs||{})){try{await idb.set('docs',id,await (await fetch(u)).blob())}catch(_){}}
  S={v:1,vehicles:d.vehicles,recs:d.recs||[],personal:d.personal||{},meta:{lastBackup:Date.now()}};await persist();go('home');toast('הנתונים שוחזרו');
}
function openMenu(){
  const lb=S.meta.lastBackup;
  const s=sheet(`<div class="snav"><span></span><span class="ttl">הגדרות</span><button class="r" data-close>סיום</button></div>
    <div class="group"><button class="row" data-a="backup"><span class="lbl">גיבוי</span>${CHEV}</button><button class="row" data-a="restore"><span class="lbl">שחזור מגיבוי</span>${CHEV}</button></div>
    <div class="foot">הנתונים והתמונות נשמרים רק במכשיר הזה. ${lb?`גיבוי אחרון: ${new Date(lb).toLocaleDateString('he-IL')}.`:'עוד לא נשמר גיבוי.'} הגיבוי כולל גם את התמונות.</div>
    <div class="gap"></div>
    <div class="group"><button class="row" data-a="wipe"><span style="color:var(--red)">מחיקת כל הנתונים</span></button></div>`);
  s.el.querySelector('[data-close]').onclick=s.close;
  const act={backup:()=>{s.close();backupJSON()},restore:()=>{s.close();$('#fileJson').click()},
    wipe:async()=>{s.close();const ok=await ask('למחוק את כל הנתונים?','כל כלי הרכב, הרישומים והתמונות יימחקו מהמכשיר.',[{label:'מחיקת הכל',val:true,cls:'danger'},{label:'ביטול',val:false}]);
      if(!ok)return;S=fresh();await idb.clear('docs').catch(()=>{});await persist();go('home');toast('הכל נמחק')}};
  s.el.querySelectorAll('[data-a]').forEach(b=>b.onclick=act[b.dataset.a]);
}

/* ---------- start ---------- */
$('#addRec').onclick=async()=>{
  if(!S.vehicles.length){editVehicle(null);return}
  const vid=UI.view==='veh'?UI.vid:await pickVehicle();if(!vid)return;
  const t=await ask('מה לרשום?','',[{label:'טיפול',val:'svc'},{label:'ביטוח',val:'ins'},{label:'טסט ורישיון',val:'test'},{label:'אחר',val:'other'},{label:'ביטול',val:null}]);
  if(t)editRecord({vid,type:t});
};
$('#fileJson').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)restoreJSON(f)};
$('#fileDoc').onchange=e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)onDocFiles(fs)};
(async()=>{
  await load();render();
  if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(_){}}
})();
</script>
